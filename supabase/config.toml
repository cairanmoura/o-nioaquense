project_id = "o-nioaquense"

# -----------------------------------------------------------------------------
# Configuracao local do Supabase CLI (opcional, mas recomendada)
# -----------------------------------------------------------------------------

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Sem seed: regra do projeto, zero dados ficticios.
[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "25MiB"

[inbucket]
enabled = true
port = 54324
